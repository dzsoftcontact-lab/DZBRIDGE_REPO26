<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manager portal · DZ-Bridge</title>
<meta name="description" content="DZ-Bridge sovereign administration portal: users, 2D database schema studio, audit logs, API management, and translations.">
<link rel="icon" type="image/png" href="/frontend/DZ%20Bridge%20Favicon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<script src="/frontend/d3.min.js"></script>
<script src="/frontend/xlsx.full.min.js"></script>
<script>
(function(){
  function c(n){var v=document.cookie.match('(^|;) ?'+n+'=([^;]*)(;|$)');return v?decodeURIComponent(v[2]):null;}
  var p=new URLSearchParams(location.search);var qt=p.get('token');
  if(qt){localStorage.setItem('dzb_token',qt);localStorage.setItem('dz_token',qt);history.replaceState(null,'',location.pathname+location.hash);}
  var tok=localStorage.getItem('dzb_token')||localStorage.getItem('dz_token')||c('dzb_token')||c('dz_token');
  if(!tok&&!c('dz_user')){location.replace('/login.html?redirect='+encodeURIComponent(location.pathname));}
  var th=localStorage.getItem('dzb-theme');if(th==='dark')document.documentElement.setAttribute('data-theme','dark');
  var lg=localStorage.getItem('dzb-mgr-lang')||'en';document.documentElement.lang=lg;document.documentElement.dir=lg==='ar'?'rtl':'ltr';
})();
</script>
<style>
:root{
  --plum-900:#28011F;--plum-800:#3A0233;--plum-700:#4E0D45;
  --lav-100:#F5ECF5;--lav-200:#EEDDEE;
  --gold-700:#9A7424;--gold-500:#C9A24B;--gold-100:#F6EDD8;
  --emerald-900:#04261C;--emerald-800:#064E3B;--emerald-700:#0B6B4F;--emerald-600:#10815F;--emerald-500:#10B981;--emerald-100:#E4F6EE;--emerald-50:#F2FBF7;
  --n-0:#FFFFFF;--n-50:#FAF8F3;--n-100:#F2EFE9;--n-200:#E6E0D3;--n-400:#9AA39E;--n-600:#5D6B64;--n-900:#13201A;
  --green-600:#2E7D4F;--green-50:#E7F3EC;--amber-600:#B26B12;--amber-50:#FBF0DC;--red-600:#B42318;--red-50:#FCE9E7;
  --brand:var(--emerald-800);--brand-hover:var(--emerald-700);
  --bg-page:var(--n-50);--bg-surface:var(--n-0);--bg-subtle:var(--n-100);
  --text-primary:var(--n-900);--text-secondary:var(--n-600);--text-muted:var(--n-400);--text-brand:var(--emerald-800);
  --text-on-brand:var(--n-0);--text-accent:var(--gold-700);
  --border:var(--n-200);--border-strong:var(--n-400);--border-focus:var(--gold-500);
  --accent-gold:var(--gold-500);--accent-gold-subtle:var(--gold-100);--accent-lavender:var(--lav-200);--accent-lavender-subtle:var(--lav-100);
  --accent-mint:var(--emerald-100);--accent-mint-subtle:var(--emerald-50);
  --success:var(--green-600);--success-subtle:var(--green-50);--warning:var(--amber-600);--warning-subtle:var(--amber-50);--error:var(--red-600);--error-subtle:var(--red-50);
  --sans:"DM Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --serif:"Fraunces","Iowan Old Style",Palatino,Georgia,serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --arabic:"Cairo","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:18px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg-page:#0B1410;--bg-surface:#12201A;--bg-subtle:#182B23;
  --text-primary:#F2FBF7;--text-secondary:#B4C4BC;--text-muted:#7A8F85;--text-brand:#E4F6EE;--text-accent:#C9A24B;
  --border:#20382E;--border-strong:#3D6354;
  --brand:#10B981;--brand-hover:#34D399;--text-on-brand:#04261C;
  --accent-lavender:#2A1E29;--accent-lavender-subtle:#1D141C;--accent-gold-subtle:#2D200A;
  --accent-mint:#18362A;--accent-mint-subtle:#10241C;
  --success:#5CC489;--success-subtle:#12301F;--warning:#F0A848;--warning-subtle:#3B2A10;--error:#F97066;--error-subtle:#3A1214;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg-page);color:var(--text-primary);font:400 15px/22px var(--sans);-webkit-font-smoothing:antialiased}
:root[lang="ar"] body{font:400 15px/26px var(--arabic)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block}
[hidden]{display:none!important}
:focus-visible{outline:3px solid color-mix(in srgb,var(--border-focus) 65%,transparent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono)}.muted{color:var(--text-muted)}.sec{color:var(--text-secondary)}

/* top bar */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;height:64px;padding:0 20px;background:color-mix(in srgb,var(--bg-surface) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font:600 18px/24px var(--sans);letter-spacing:-.01em;flex:none;width:220px}
.brand small{font:500 11px/1 var(--mono);color:var(--text-accent);letter-spacing:.06em;text-transform:uppercase}
.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--brand);color:var(--text-on-brand);font:600 15px/15px var(--serif)}
.burger{display:none;place-items:center;width:40px;height:40px;border:0;border-radius:10px;background:none;cursor:pointer}
.gsearch{position:relative;flex:1;max-width:440px;margin:0 auto}
.gsearch svg{position:absolute;top:50%;inset-inline-start:13px;transform:translateY(-50%);color:var(--text-muted)}
.gsearch input{width:100%;height:40px;padding:0 14px;padding-inline-start:38px;border:1px solid var(--border);border-radius:12px;background:var(--bg-subtle)}
.gsearch input:focus{outline:none;border-color:var(--brand);background:var(--bg-surface)}
.tacts{display:flex;align-items:center;gap:10px;flex:none}
.ibtn{position:relative;display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:999px;background:transparent;cursor:pointer;color:var(--text-primary)}
.ibtn:hover{background:var(--bg-subtle)}
.theme-btn .moon{display:none}
:root[data-theme="dark"] .theme-btn .sun{display:none}
:root[data-theme="dark"] .theme-btn .moon{display:block}
.langsel{height:36px;padding:0 10px;border:1px solid var(--border);border-radius:999px;background:var(--bg-surface);cursor:pointer;font:500 13px/1 var(--sans)}
.react-link{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--plum-800);color:#FFFFFF;font:600 12px/1 var(--mono);border:1px solid var(--gold-500);transition:all .15s}
.react-link:hover{background:var(--plum-700);transform:translateY(-1px);box-shadow:0 4px 12px rgba(40,1,31,.25)}
.user{position:relative}
.ubtn{display:flex;align-items:center;gap:10px;padding:4px;padding-inline-end:10px;border:0;border-radius:999px;background:none;text-align:start;cursor:pointer}
.ubtn:hover{background:var(--bg-subtle)}
.ubtn b{display:block;font-weight:600;font-size:14px;line-height:18px}
.ubtn small{display:block;font-size:12px;line-height:16px;color:var(--text-secondary)}
.av{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent-mint);color:var(--emerald-800);font:600 12px/1 var(--mono)}
.menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;min-width:210px;margin:0;padding:6px;list-style:none;background:var(--bg-surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 14px 32px -14px rgba(4,38,28,.35);z-index:50}
.menu a,.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;border-radius:9px;background:none;font-size:14px;text-align:start;cursor:pointer}
.menu a:hover,.menu button:hover{background:var(--bg-subtle)}

/* shell */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 64px)}
.side{position:sticky;top:64px;display:flex;flex-direction:column;height:calc(100vh - 64px);padding:18px 12px;border-inline-end:1px solid var(--border);background:var(--bg-surface)}
.nav{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.nav a{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:11px;font-weight:500;font-size:14.5px;color:var(--text-secondary)}
.nav a:hover{background:var(--bg-subtle);color:var(--text-primary)}
.nav a[aria-current="page"]{background:var(--accent-mint);color:var(--text-brand);font-weight:600}
.nav .badge{margin-inline-start:auto;min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:var(--bg-subtle);font:600 11.5px/20px var(--sans);text-align:center;color:var(--text-secondary)}
.nav a[aria-current="page"] .badge{background:var(--brand);color:var(--text-on-brand)}
.nav hr{margin:10px 6px;border:0;border-top:1px solid var(--border)}
.nav .grp{padding:6px 12px 4px;font:400 11px/14px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
.sfoot{margin-top:auto;padding:12px;font-size:12.5px;color:var(--text-muted)}
.sfoot .live{display:inline-flex;align-items:center;gap:6px}
.sfoot .live i{width:8px;height:8px;border-radius:50%;background:var(--text-muted)}
.sfoot .live.on i{background:var(--success)}
.scrim{display:none}
main{min-width:0;padding:28px clamp(16px,3vw,36px) 56px}
.view{max-width:1320px;margin:0 auto}

/* page head */
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:14px 20px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{margin:0;font:600 clamp(24px,2.6vw,30px)/1.2 var(--serif);letter-spacing:-.015em}
:root[lang="ar"] .ph h1{font:700 clamp(22px,2.4vw,27px)/1.5 var(--arabic)}
.ph p{margin:4px 0 0;color:var(--text-secondary);font-size:14.5px}
.ph .btns{display:flex;gap:10px;flex-wrap:wrap}
.crumb{margin-bottom:6px;font:400 12.5px/18px var(--mono);color:var(--text-muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:1.5px solid transparent;font:500 14px/20px var(--sans);white-space:nowrap;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
:root[lang="ar"] .btn{font-family:var(--arabic);font-weight:600}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:var(--text-on-brand)}
.btn-primary:hover{background:var(--brand-hover)}
.btn-ghost{background:var(--bg-surface);border-color:var(--border-strong)}
.btn-ghost:hover{border-color:var(--brand);color:var(--text-brand)}
.btn-danger{background:var(--bg-surface);border-color:var(--error);color:var(--error)}
.btn-danger:hover{background:var(--error-subtle)}
.btn-danger.solid{background:var(--error);color:#fff}
.btn-sm{height:32px;padding:0 13px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* cards & layout */
.card{position:relative;border:1px solid var(--border);border-radius:var(--r);background:var(--bg-surface)}
.card>header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.card>header h2{margin:0;font:600 15.5px/22px var(--sans)}
:root[lang="ar"] .card>header h2{font-family:var(--arabic)}
.cb{padding:16px 20px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.gridL{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.stack{display:grid;gap:18px;min-width:0}
.kick{font:400 11px/14px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
.note{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border:1px solid var(--border);border-radius:14px;background:var(--bg-surface);font-size:14px;line-height:20px}
.note.warn{background:var(--warning-subtle);border-color:color-mix(in srgb,var(--warning) 35%,transparent)}
.note.err{background:var(--error-subtle);border-color:color-mix(in srgb,var(--error) 35%,transparent);color:var(--error)}
.note.ok{background:var(--success-subtle);border-color:color-mix(in srgb,var(--success) 30%,transparent)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px}
.kpi span{display:block;font-size:13px;color:var(--text-secondary)}
.kpi b{display:block;margin:6px 0 2px;font:600 30px/36px var(--serif)}
.kpi small{font-size:12px;color:var(--text-muted)}
.kpi.hot{border-color:var(--accent-gold);background:color-mix(in srgb,var(--accent-gold-subtle) 55%,var(--bg-surface))}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font:500 12px/1 var(--sans);white-space:nowrap;background:var(--bg-subtle);color:var(--text-secondary)}
.pill.ok{background:var(--success-subtle);color:var(--success)}
.pill.warn{background:var(--warning-subtle);color:var(--warning)}
.pill.bad{background:var(--error-subtle);color:var(--error)}
.pill.brand{background:var(--accent-mint);color:var(--emerald-800)}
.pill.gold{background:var(--accent-gold-subtle);color:var(--text-accent)}
.pill.plum{background:var(--lav-100);color:var(--plum-800)}
.m{display:inline-grid;place-items:center;min-width:58px;height:22px;padding:0 6px;border-radius:6px;font:600 11px/1 var(--mono)}
.m.GET{background:var(--success-subtle);color:var(--success)}
.m.POST{background:var(--accent-lavender);color:var(--plum-800)}
.m.PUT,.m.PATCH{background:var(--warning-subtle);color:var(--warning)}
.m.DELETE{background:var(--error-subtle);color:var(--error)}

/* tables */
.tblw{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{padding:10px 16px;background:var(--bg-subtle);font-weight:500;font-size:12.5px;color:var(--text-secondary);text-align:start;white-space:nowrap}
.tbl td{padding:12px 16px;border-top:1px solid var(--border);vertical-align:middle}
.tbl td.cell{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12.5px}
.tbl .t{display:flex;align-items:center;gap:12px;min-width:220px}
.tbl .t b{display:block;font-weight:600;line-height:20px}
.tbl .t small{display:block;font:400 12px/16px var(--mono);color:var(--text-muted)}
.tbl td.end,.tbl th.end{text-align:end;white-space:nowrap}
.empty{padding:36px 20px;text-align:center;color:var(--text-secondary)}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--border)}
.ctl{width:100%;height:40px;padding:0 12px;border:1px solid var(--border-strong);border-radius:11px;background:var(--bg-surface)}
textarea.ctl{height:auto;min-height:90px;padding:10px 12px;line-height:20px;resize:vertical;font-family:var(--mono);font-size:13px}
.ctl:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--border-focus) 40%,transparent)}
.filters .ctl{width:auto;min-width:150px}
.filters .grow{flex:1 1 240px}
.pager{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--border);font:400 12.5px/1 var(--mono);color:var(--text-secondary)}
.pager .sp{flex:1}
.pager button{display:grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border:1px solid var(--border-strong);border-radius:8px;background:var(--bg-surface);cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}

/* sub-navigation tabs (Database Studio) */
.subtabs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;background:var(--bg-subtle);padding:6px;border-radius:14px;border:1px solid var(--border);margin-bottom:18px}
.subtabs button{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;border:0;background:transparent;color:var(--text-secondary);font:600 13px/1 var(--sans);cursor:pointer;transition:all .15s}
.subtabs button:hover{color:var(--text-primary);background:color-mix(in srgb,var(--bg-surface) 60%,transparent)}
.subtabs button.active{background:var(--bg-surface);color:var(--text-primary);box-shadow:0 2px 6px rgba(0,0,0,.08);color:var(--text-brand)}
.subtabs button .pill{height:18px;padding:0 6px;font-size:10.5px}

/* 2D ERD Visual Canvas */
.erd-wrap{position:relative;border:1px solid var(--border);border-radius:var(--r);background:var(--bg-surface);overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.03)}
.erd-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg-subtle);flex-wrap:wrap}
.erd-acts{display:flex;align-items:center;gap:6px}
.erd-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg-surface);cursor:pointer;font:500 12.5px/1 var(--sans)}
.erd-btn:hover{border-color:var(--brand);color:var(--text-brand)}
.erd-btn.active{background:var(--accent-gold-subtle);border-color:var(--accent-gold);color:var(--gold-700);font-weight:600}
.erd-cats{display:flex;align-items:center;gap:4px;overflow-x:auto}
.erd-chip{height:26px;padding:0 9px;border-radius:999px;border:1px solid var(--border);background:var(--bg-surface);font:500 11.5px/1 var(--sans);cursor:pointer;white-space:nowrap}
.erd-chip:hover,.erd-chip.active{background:var(--brand);color:var(--text-on-brand);border-color:var(--brand)}
#erdSvg{width:100%;height:620px;display:block;cursor:grab;background:radial-gradient(circle, color-mix(in srgb,var(--border) 45%,transparent) 1px, transparent 1px);background-size:24px 24px}
#erdSvg:active{cursor:grabbing}
.erd-node{cursor:pointer;transition:opacity .2s}
.erd-node rect.box{fill:var(--bg-surface);stroke:var(--border-strong);stroke-width:1.5px;rx:12px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.06))}
.erd-node:hover rect.box{stroke:var(--brand);stroke-width:2.2px}
.erd-node.selected rect.box{stroke:var(--accent-gold);stroke-width:2.8px;filter:drop-shadow(0 6px 16px rgba(201,162,75,.35))}
.erd-node.dimmed{opacity:.22}
.erd-path{fill:none;stroke:color-mix(in srgb,var(--border-strong) 85%,transparent);stroke-width:1.8px;transition:stroke .15s,stroke-width .15s}
.erd-path:hover,.erd-path.highlight{stroke:var(--accent-gold);stroke-width:3px;filter:drop-shadow(0 0 6px rgba(201,162,75,.6))}
.erd-path.dimmed{opacity:.12}
.erd-tooltip{position:absolute;z-index:60;pointer-events:none;padding:6px 10px;border-radius:8px;background:var(--n-900);color:#FFFFFF;font:500 12px/16px var(--mono);box-shadow:0 6px 18px rgba(0,0,0,.3);opacity:0;transition:opacity .15s;transform:translate(-50%,-100%)}
.erd-drawer{position:absolute;bottom:16px;inset-inline-end:16px;width:340px;max-width:calc(100% - 32px);background:var(--bg-surface);border:1.5px solid var(--border-strong);border-radius:14px;padding:16px;box-shadow:0 18px 36px -12px rgba(0,0,0,.3);z-index:30}
.erd-drawer header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.erd-drawer header h3{margin:0;font:700 16px/20px var(--mono)}
.erd-drawer .cols-preview{max-height:160px;overflow-y:auto;display:grid;gap:4px;margin-bottom:12px;padding:6px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.erd-drawer .cols-preview div{display:flex;justify-content:space-between;font:400 12px/16px var(--mono)}

/* code boxes */
pre.codeblock{margin:0;padding:16px;background:var(--bg-subtle);border-radius:12px;font:400 12.5px/20px var(--mono);overflow-x:auto;max-height:500px;border:1px solid var(--border);white-space:pre-wrap}
.code-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--bg-surface);border:1px solid var(--border);border-bottom:0;border-radius:12px 12px 0 0}

/* dialog */
dialog.dlg{width:min(600px,calc(100vw - 32px));max-height:calc(100vh - 48px);padding:0;border:1px solid var(--border);border-radius:20px;background:var(--bg-surface);color:var(--text-primary);box-shadow:0 30px 60px -20px rgba(4,38,28,.45)}
dialog.dlg::backdrop{background:rgba(4,38,28,.45);backdrop-filter:blur(3px)}
.dlg header{padding:18px 22px 6px}
.dlg h2{margin:0;font:600 19px/26px var(--serif)}
.dlg header p{margin:4px 0 0;color:var(--text-secondary);font-size:14px}
.dlg .body{display:grid;gap:12px;padding:12px 22px;overflow-y:auto;max-height:60vh}
.dlg footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 20px}
.fld{display:grid;gap:6px}
.fld label{font-size:13px;font-weight:500;color:var(--text-secondary)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;z-index:100;max-width:calc(100vw - 32px);padding:12px 18px;border-radius:999px;background:var(--emerald-900);color:#FFFFFF;font-size:14px;box-shadow:0 16px 32px -12px rgba(4,38,28,.5);transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
:root[data-theme="dark"] .toast{background:var(--emerald-100);color:var(--emerald-900)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--error);color:#fff}

@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1060px){.grid2,.gridL{grid-template-columns:1fr}}
@media (max-width:900px){
  .brand{width:auto}.burger{display:grid}.shell{grid-template-columns:1fr}
  .side{position:fixed;top:64px;bottom:0;inset-inline-start:0;z-index:45;width:260px;height:auto;transform:translateX(-105%);transition:transform .2s}
  :root[dir="rtl"] .side{transform:translateX(105%)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:64px 0 0;z-index:44;background:rgba(4,38,28,.35)}
  .gsearch{display:none}.tacts{margin-inline-start:auto}
}
@media (max-width:640px){.ubtn span{display:none}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.row2,.req{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function api(method,path,body,opt){
  opt=opt||{};
  var h={'Accept':'application/json'};
  if(body!==undefined&&body!==null)h['Content-Type']='application/json';
  var tk=opt.token!==undefined?opt.token:token();
  if(tk)h.Authorization='Bearer '+tk;
  var t0=performance.now();
  return fetch(path,{method:method,headers:h,credentials:'include',body:(body!==undefined&&body!==null)?JSON.stringify(body):undefined})
   .then(function(r){return r.text().then(function(txt){var d;try{d=JSON.parse(txt);}catch(e){d=txt;}return {ok:r.ok,status:r.status,data:d,ms:Math.round(performance.now()-t0)};});})
   .catch(function(e){return {ok:false,status:0,data:{error:e.message},ms:Math.round(performance.now()-t0)};});
}
function errMsg(r){return (r.data&&(r.data.error||r.data.message||r.data.detail))||(T('failed')+' ('+r.status+')');}

function loadState(){

    setLive(r.ok);

}
function setLive(ok){var el=$('#liveInd');if(el)el.classList.toggle('on',!!ok);var tx=$('#liveTxt');if(tx)tx.textContent=ok?T('online'):T('offline');}
function tablesList(){
  var st=S.state||{};var dropped=new Set(st.dropped_tables||[]);var map={};var out=[];
  (st.schema_tables||[]).forEach(function(t){if(dropped.has(t.name))return;map[t.name]=1;out.push({name:t.name,id:t.id,description:t.description||'',category:t.category||'Custom',columns:t.columns||[],rows:(st.table_data_store||{})[t.name]||[]});});
  Object.keys(st.table_data_store||{}).forEach(function(n){
    if(map[n]||dropped.has(n))return;
    var rows=st.table_data_store[n]||[];var keys={};rows.slice(0,50).forEach(function(r){Object.keys(r).forEach(function(k){keys[k]=1;});});
    out.push({name:n,id:null,description:'',category:'Data',columns:Object.keys(keys).map(function(k){return {name:k,type:'VARCHAR(255)',isPrimary:k==='id'};}),rows:rows});
  });
  return out.sort(function(a,b){return a.name.localeCompare(b.name);});
}
function schemaRelations(){
  var st=S.state||{};var dropped=new Set(st.dropped_tables||[]);
  return (st.schema_relations||[]).filter(function(r){return !dropped.has(r.sourceTable)&&!dropped.has(r.targetTable);});
}
function updateBadges(){
  var st=S.state||{};
  var bu=$('#bUsers');if(bu){bu.textContent=(st.users||[]).length;bu.hidden=false;}
  var bt=$('#bTables');if(bt){bt.textContent=tablesList().length;bt.hidden=false;}
}

  try{var rtf=new Intl.RelativeTimeFormat(LANG,{numeric:'auto'});if(Math.abs(m)<60)return rtf.format(-m,'minute');var h=Math.round(m/60);if(Math.abs(h)<24)return rtf.format(-h,'hour');return rtf.format(-Math.round(h/24),'day');}catch(e){return fmtDate(s);}}

/* ---------------- EXPORTS ---------------- */
function downloadFile(filename,content,mime){
  var blob=new Blob([content],{type:mime||'text/plain;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();
}
function exportSqlDump(){
  var tl=tablesList();var rels=schemaRelations();
  var sql='-- =====================================================================\n';
  sql+='-- DZ-Bridge Sovereign Matchmaking Ecosystem - Full Database SQL Dump\n';
  sql+='-- Generated: '+new Date().toISOString()+'\n';
  sql+='-- Target Engine: PostgreSQL 16+ with UUID and JSONB\n';
  sql+='-- =====================================================================\n\n';
  sql+='CREATE EXTENSION IF NOT EXISTS "uuid-ossp";\n\n';

  tl.forEach(function(t){
    sql+='-- Table: '+t.name+' ('+(t.description||'')+')\n';
    sql+='DROP TABLE IF EXISTS '+t.name+' CASCADE;\n';
    sql+='CREATE TABLE '+t.name+' (\n';
    var lines=(t.columns||[]).map(function(c){
      var l='  '+c.name+' '+(c.type||'VARCHAR(255)');
      if(c.isPrimary)l+=' PRIMARY KEY';
      if(!c.isNullable&&!c.isPrimary)l+=' NOT NULL';
      if(c.defaultValue)l+=' DEFAULT '+c.defaultValue;
      return l;
    });
    sql+=lines.join(',\n')+'\n);\n\n';

    if(t.rows&&t.rows.length){
      sql+='-- Data rows for '+t.name+' ('+t.rows.length+' rows)\n';
      t.rows.forEach(function(r){
        var cols=Object.keys(r);
        var vals=cols.map(function(k){
          var v=r[k];if(v===null||v===undefined)return 'NULL';
          if(typeof v==='number'||typeof v==='boolean')return String(v);
          if(typeof v==='object')return "'"+JSON.stringify(v).replace(/'/g,"''")+"'::jsonb";
          return "'"+String(v).replace(/'/g,"''")+"'";
        });
        sql+='INSERT INTO '+t.name+' ('+cols.join(', ')+') VALUES ('+vals.join(', ')+');\n';
      });
      sql+='\n';
    }
  });

  if(rels.length){
    sql+='-- Foreign Key Relational Constraints\n';
    rels.forEach(function(r){
      sql+='ALTER TABLE '+r.sourceTable+' ADD CONSTRAINT fk_'+r.sourceTable+'_'+r.sourceColumn+'_to_'+r.targetTable+'\n';
      sql+='  FOREIGN KEY ('+r.sourceColumn+') REFERENCES '+r.targetTable+'('+r.targetColumn+') ON DELETE '+(r.onDelete||'CASCADE')+';\n\n';
    });
  }
  downloadFile('dzbridge-dump-'+new Date().toISOString().slice(0,10)+'.sql',sql,'application/sql');
  toast(T('exportSql')+' · '+T('done'));
}

function exportExcelWorkbook(){
  if(typeof XLSX==='undefined'){toast('SheetJS library loading…',true);return;}
  var wb=XLSX.utils.book_new();
  var tl=tablesList();
  tl.forEach(function(t){
    var sheetData=t.rows&&t.rows.length?t.rows:(t.columns.length?[t.columns.reduce(function(acc,c){acc[c.name]='';return acc;},{})]:[]);
    var ws=XLSX.utils.json_to_sheet(sheetData);
    var sheetName=t.name.slice(0,31).replace(/[\\/?*\[\]]/g,'_');
    XLSX.utils.book_append_sheet(wb,ws,sheetName);
  });
  XLSX.writeFile(wb,'dzbridge-database-'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast(T('exportExcel')+' · '+T('done'));
}

/* ---------------- DAG & INTEGRITY AUDIT ---------------- */
function runIntegrityAudit(simCycle){
  var tables=tablesList();var relations=schemaRelations().slice();
  if(simCycle){
    relations.push({id:'sim-trap',sourceTable:'users',sourceColumn:'id',targetTable:'notifications',targetColumn:'user_id',onDelete:'CASCADE'});
  }
  var adj={};tables.forEach(function(t){adj[t.name]=[];});
  relations.forEach(function(r){if(adj[r.sourceTable])adj[r.sourceTable].push(r.targetTable);});

  var visited={};var cycles=[];var path=[];
  function dfs(u){
    visited[u]=1;path.push(u);
    var neighbors=adj[u]||[];
    for(var i=0;i<neighbors.length;i++){
      var v=neighbors[i];
      if(visited[v]===1){
        var idx=path.indexOf(v);
        cycles.push(path.slice(idx).concat([v]));
      }else if(!visited[v]){
        dfs(v);
      }
    }
    path.pop();visited[u]=2;
  }
  Object.keys(adj).forEach(function(node){if(!visited[node])dfs(node);});

  // Broken FK check
  var brokenRows=[];
  relations.forEach(function(rel){
    var srcTable=tables.filter(function(t){return t.name===rel.sourceTable;})[0];
    var tgtTable=tables.filter(function(t){return t.name===rel.targetTable;})[0];
    if(srcTable&&tgtTable){
      var tgtIds=new Set((tgtTable.rows||[]).map(function(r){return String(r[rel.targetColumn]);}));
      (srcTable.rows||[]).forEach(function(row){
        var fv=row[rel.sourceColumn];
        if(fv!==null&&fv!==undefined&&fv!==''&&!tgtIds.has(String(fv))){
          brokenRows.push({sourceTable:rel.sourceTable,targetTable:rel.targetTable,rowId:row.id,fkValue:fv});
        }
      });
    }
  });

  return {isDAG:cycles.length===0,cycles:cycles,brokenFkRows:brokenRows,totalTables:tables.length,totalRelations:relations.length};
}

function initD3ErdGraph(tables,relations){
  if(typeof d3==='undefined'){
    $('#erdSvg').innerHTML='<text x="50%" y="50%" text-anchor="middle" fill="currentColor">D3 library loading…</text>';
    return;
  }
  var svgEl=$('#erdSvg');var width=svgEl.clientWidth||1200;var height=620;
  var svg=d3.select('#erdSvg');
  svg.selectAll('*').remove();

  var defs=svg.append('defs');
  // Marker arrow
  defs.append('marker').attr('id','erd-arrow').attr('viewBox','0 -5 10 10').attr('refX',9).attr('refY',0).attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto')
    .append('path').attr('d','M0,-4L9,0L0,4').attr('fill','var(--border-strong)');
  defs.append('marker').attr('id','erd-arrow-hover').attr('viewBox','0 -5 10 10').attr('refX',9).attr('refY',0).attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto')
    .append('path').attr('d','M0,-4L9,0L0,4').attr('fill','var(--accent-gold)');

  var rootG=svg.append('g').attr('class','root-group');

  var zoom=d3.zoom().scaleExtent([0.15,2.5]).on('zoom',function(e){rootG.attr('transform',e.transform);});
  svg.call(zoom);

  // Layout node coordinates (grid or clustered)
  var nodeW=200;var nodeH=170;var colsCount=Math.max(3,Math.ceil(Math.sqrt(tables.length*1.8)));
  var nodes=tables.map(function(t,i){
    var col=i%colsCount;var row=Math.floor(i/colsCount);
    return {
      id:t.name,name:t.name,category:t.category||'Custom',table:t,
      width:nodeW,height:nodeH,
      x:col*(nodeW+90)+100,y:row*(nodeH+80)+80,
      vx:0,vy:0
    };
  });
  var nodeMap={};nodes.forEach(function(n){nodeMap[n.id]=n;});

  var links=[];
  relations.forEach(function(r){
    if(nodeMap[r.sourceTable]&&nodeMap[r.targetTable]){
      links.push({
        id:r.id||(r.sourceTable+'-'+r.targetTable),
        source:nodeMap[r.sourceTable],
        target:nodeMap[r.targetTable],
        rel:r
      });
    }
  });

  // Render links
  var linkG=rootG.append('g').attr('class','links-group');
  var pathEls=linkG.selectAll('path').data(links).enter().append('path')
    .attr('class','erd-path')
    .attr('marker-end','url(#erd-arrow)')
    .on('mouseenter',function(e,d){
      d3.select(this).attr('class','erd-path highlight').attr('marker-end','url(#erd-arrow-hover)');
      var tip=$('#erdTip');if(tip){
        tip.innerHTML=esc(d.rel.sourceTable+'.'+d.rel.sourceColumn)+' → <b>'+esc(d.rel.targetTable+'.'+d.rel.targetColumn)+'</b> <span style="color:var(--accent-gold)">['+esc(d.rel.onDelete||'CASCADE')+']</span>';
        tip.style.left=(e.offsetX+10)+'px';tip.style.top=(e.offsetY-10)+'px';tip.style.opacity='1';
      }
    })
    .on('mouseleave',function(){
      d3.select(this).attr('class','erd-path').attr('marker-end','url(#erd-arrow)');
      var tip=$('#erdTip');if(tip)tip.style.opacity='0';
    });

  // Render nodes
  var nodeG=rootG.append('g').attr('class','nodes-group');
  var nodeEls=nodeG.selectAll('g').data(nodes).enter().append('g')
    .attr('class','erd-node')
    .attr('transform',function(d){return 'translate('+d.x+','+d.y+')';})
    .call(d3.drag()
      .on('start',function(e,d){d3.select(this).raise();})
      .on('drag',function(e,d){
        d.x+=e.dx;d.y+=e.dy;
        d3.select(this).attr('transform','translate('+d.x+','+d.y+')');
        updatePaths();
      })
    )
    .on('click',function(e,d){
      e.stopPropagation();
      DB.sel=d.name;
      d3.selectAll('.erd-node').classed('selected',function(n){return n.name===d.name;});
      openTableDrawer(d.table);
    })
    .on('mouseenter',function(e,d){
      var connected=new Set([d.name]);
      links.forEach(function(l){
        if(l.source.name===d.name)connected.add(l.target.name);
        if(l.target.name===d.name)connected.add(l.source.name);
      });
      d3.selectAll('.erd-node').classed('dimmed',function(n){return !connected.has(n.name);});
      pathEls.classed('highlight',function(l){return l.source.name===d.name||l.target.name===d.name;})
             .classed('dimmed',function(l){return l.source.name!==d.name&&l.target.name!==d.name;});
    })
    .on('mouseleave',function(){
      d3.selectAll('.erd-node').classed('dimmed',false);
      pathEls.classed('highlight',false).classed('dimmed',false);
    });

  // Card background rect
  nodeEls.append('rect').attr('class','box')
    .attr('width',nodeW).attr('height',nodeH);

  // Category top stripe
  nodeEls.append('rect')
    .attr('x',0).attr('y',0).attr('width',nodeW).attr('height',4).attr('rx',2)
    .attr('fill',function(d){
      return d.category==='Identity'?'var(--plum-800)':d.category==='Matchmaking'?'var(--gold-500)':d.category==='Academic'?'var(--emerald-600)':'var(--border-strong)';
    });

  // Header Title
  nodeEls.append('text')
    .attr('x',12).attr('y',24)
    .attr('font-weight','700').attr('font-family','var(--mono)').attr('font-size','12.5px').attr('fill','currentColor')
    .text(function(d){return d.name.length>18?d.name.slice(0,17)+'…':d.name;});

  // Category pill tag inside node
  nodeEls.append('text')
    .attr('x',nodeW-12).attr('y',23)
    .attr('text-anchor','end').attr('font-family','var(--sans)').attr('font-size','10px').attr('fill','var(--text-muted)')
    .text(function(d){return d.category;});

  // Divider
  nodeEls.append('line')
    .attr('x1',0).attr('y1',34).attr('x2',nodeW).attr('y2',34)
    .attr('stroke','var(--border)').attr('stroke-width',1);

  // Top 5 columns
  nodeEls.each(function(d){
    var g=d3.select(this);var cols=(d.table.columns||[]).slice(0,5);
    cols.forEach(function(c,idx){
      var y=50+idx*19;
      // Key indicator
      if(c.isPrimary){
        g.append('text').attr('x',12).attr('y',y).attr('font-size','10px').attr('fill','var(--accent-gold)').text('🔑');
      }else if(c.isForeign){
        g.append('text').attr('x',12).attr('y',y).attr('font-size','10px').attr('fill','var(--emerald-600)').text('🔗');
      }else{
        g.append('circle').attr('cx',15).attr('cy',y-3).attr('r',2).attr('fill','var(--text-muted)');
      }
      // Col name
      g.append('text')
        .attr('x',26).attr('y',y)
        .attr('font-family','var(--mono)').attr('font-size','11px').attr('fill','currentColor')
        .text(c.name.length>13?c.name.slice(0,12)+'…':c.name);
      // Col type
      g.append('text')
        .attr('x',nodeW-12).attr('y',y)
        .attr('text-anchor','end').attr('font-family','var(--mono)').attr('font-size','9.5px').attr('fill','var(--text-muted)')
        .text((c.type||'').split('(')[0].slice(0,8));
    });
    // Footer row counter
    g.append('line').attr('x1',0).attr('y1',nodeH-26).attr('x2',nodeW).attr('y2',nodeH-26).attr('stroke','var(--border)').attr('stroke-width',1);
    g.append('text').attr('x',12).attr('y',nodeH-10).attr('font-family','var(--mono)').attr('font-size','10.5px').attr('fill','var(--text-secondary)')
      .text(d.table.rows.length+' '+T('rows')+' · '+(d.table.columns||[]).length+' cols');
  });

  function updatePaths(){
    pathEls.attr('d',function(d){
      var sx=d.source.x+nodeW;var sy=d.source.y+nodeH/2;
      var tx=d.target.x;var ty=d.target.y+nodeH/2;
      if(d.source.x>d.target.x+nodeW){sx=d.source.x;tx=d.target.x+nodeW;}
      var dx=Math.max(40,Math.abs(tx-sx)*0.5);
      return 'M '+sx+' '+sy+' C '+(sx+dx)+' '+sy+', '+(tx-dx)+' '+ty+', '+tx+' '+ty;
    });
  }
  updatePaths();

  // Force simulation if not fixed
  var sim=null;
  if(!DB.erdFixed){
    sim=d3.forceSimulation(nodes)
      .force('link',d3.forceLink(links).id(function(d){return d.id;}).distance(180).strength(0.4))
      .force('charge',d3.forceManyBody().strength(-350))
      .force('collide',d3.forceCollide(140))
      .force('center',d3.forceCenter(width/2,height/2))
      .on('tick',function(){
        nodeEls.attr('transform',function(d){return 'translate('+d.x+','+d.y+')';});
        updatePaths();
      });
    setTimeout(function(){if(sim)sim.stop();},3000);
  }

  // Zoom controls
  $$('[data-act="erdZoomIn"]').forEach(function(b){b.onclick=function(){svg.transition().call(zoom.scaleBy,1.3);};});
  $$('[data-act="erdZoomOut"]').forEach(function(b){b.onclick=function(){svg.transition().call(zoom.scaleBy,0.77);};});
  $$('[data-act="erdReset"]').forEach(function(b){b.onclick=function(){svg.transition().call(zoom.transform,d3.zoomIdentity.translate(40,30).scale(0.85));};});
  $$('[data-act="erdTogglePos"]').forEach(function(b){b.onclick=function(){DB.erdFixed=!DB.erdFixed;PAGES.database();};});

  // Filter category
  $$('.erd-chip').forEach(function(chip){
    chip.onclick=function(){
      $$('.erd-chip').forEach(function(c){c.classList.remove('active');});
      chip.classList.add('active');
      var cat=chip.getAttribute('data-cat');
      nodeEls.style('display',function(d){return cat==='All'||d.category===cat?'block':'none';});
      pathEls.style('display',function(l){return (cat==='All'||(l.source.category===cat&&l.target.category===cat))?'block':'none';});
    };
  });
}

function renderDesignerMode(container,tl,rels,t){
  var tRels=rels.filter(function(r){return r.sourceTable===t.name||r.targetTable===t.name;});

  container.innerHTML='<div class="gridL">'+

      '<header><div><h2 class="mono">'+esc(t.name)+'</h2><div class="sec" style="font-size:13px">'+esc(t.description||'')+' · '+categoryPill(t.category)+'</div></div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
          '<button class="btn btn-primary btn-sm" data-act="addColumn" type="button">+ '+esc(T('addColumn'))+'</button>'+
          '<button class="btn btn-ghost btn-sm" data-act="addRelation" type="button">+ '+esc(T('addRelation'))+'</button>'+
          '<button class="btn btn-ghost btn-sm" data-act="editTable" type="button">'+esc(T('edit'))+'</button>'+

        '</div>'+
      '</header>'+
      '<div class="cb"><h3 style="margin:0 0 10px;font-size:14px">'+esc(T('columns'))+' ('+(t.columns||[]).length+')</h3></div>'+

/* 3.6 SQL & DJANGO MODELS CODE GENERATOR */
function renderCodeMode(container,tl,rels){
  // Generate PostgreSQL DDL
  var ddl='-- DZ-Bridge PostgreSQL 16 Relational DDL\n-- Auto-generated by Database Studio\n\nCREATE EXTENSION IF NOT EXISTS "uuid-ossp";\n\n';
  tl.forEach(function(t){
    ddl+='CREATE TABLE '+t.name+' (\n';
    var lines=(t.columns||[]).map(function(c){
      var l='  '+c.name+' '+(c.type||'VARCHAR(255)');
      if(c.isPrimary)l+=' PRIMARY KEY';
      if(!c.isNullable&&!c.isPrimary)l+=' NOT NULL';
      if(c.defaultValue)l+=' DEFAULT '+c.defaultValue;
      return l;
    });
    ddl+=lines.join(',\n')+'\n);\n\n';
  });
  rels.forEach(function(r){
    ddl+='ALTER TABLE '+r.sourceTable+' ADD CONSTRAINT fk_'+r.sourceTable+'_'+r.sourceColumn+'_to_'+r.targetTable+'\n';
    ddl+='  FOREIGN KEY ('+r.sourceColumn+') REFERENCES '+r.targetTable+'('+r.targetColumn+') ON DELETE '+(r.onDelete||'CASCADE')+';\n\n';
  });

  // Generate Django ORM Code
  var py='"""\nDZ-Bridge Django 5.1 ORM Models\nGenerated automatically by Django Schema Studio\n"""\nimport uuid\nfrom django.db import models\n\n';
  tl.forEach(function(t){
    var className=t.name.split('_').map(function(s){return s.charAt(0).toUpperCase()+s.slice(1);}).join('');
    py+='class '+className+'(models.Model):\n';
    py+='    """'+esc(t.description||t.name)+'"""\n';
    (t.columns||[]).forEach(function(c){
      var f='';
      if(c.isPrimary&&c.type.includes('UUID'))f='models.UUIDField(primary_key=True, default=uuid.uuid4, editable=False)';
      else if(c.isForeign)f="models.ForeignKey('"+(c.foreignTable||'User')+"', on_delete=models.CASCADE, null=True, blank=True)";
      else if(c.type==='BOOLEAN')f='models.BooleanField(default=False)';
      else if(c.type.includes('INT'))f='models.IntegerField(null=True, blank=True)';
      else if(c.type==='TEXT')f='models.TextField(null=True, blank=True)';
      else if(c.type.includes('TIMESTAMP'))f='models.DateTimeField(auto_now_add=True)';
      else if(c.type.includes('JSONB'))f='models.JSONField(default=dict, blank=True)';
      else f='models.CharField(max_length=255, null=True, blank=True)';
      py+='    '+c.name+' = '+f+'\n';
    });
    py+='    class Meta:\n        db_table = "'+t.name+'"\n\n\n';
  });

  container.innerHTML=
    '<div class="grid2">'+
      '<div>'+
        '<div class="code-head"><b>PostgreSQL 16 Relational DDL</b><button class="btn btn-ghost btn-sm" data-act="copyCode" data-target="sqlOut">Copy SQL</button></div>'+
        '<pre class="codeblock" id="sqlOut">'+esc(ddl)+'</pre>'+
      '</div>'+
      '<div>'+
        '<div class="code-head"><b>Django 5.1 ORM Models (Python)</b><button class="btn btn-ghost btn-sm" data-act="copyCode" data-target="pyOut">Copy Python</button></div>'+
        '<pre class="codeblock" id="pyOut">'+esc(py)+'</pre>'+
      '</div>'+
    '</div>';
}

   cols.map(function(c){
     var v=row?row[c]:'';if(v&&typeof v==='object')v=JSON.stringify(v);
     return '<div class="fld"><label class="mono">'+esc(c)+'</label><input class="ctl" name="'+esc(c)+'" value="'+esc(v==null?'':v)+'"></div>';
   }).join('')+
  '</div>'+dlgFooter(row?T('save'):T('insertRow'));
}
function parseVal(v){if(v==='true')return true;if(v==='false')return false;if(/^-?\d+(\.\d+)?$/.test(v))return Number(v);if(/^[\[{]/.test(v)){try{return JSON.parse(v);}catch(e){}}return v;}

/* ---------------- EVENT ROUTER ---------------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('button, a[data-act]');if(!b)return;
  var act=b.getAttribute('data-act');var tr=b.closest('tr');var rid=tr?tr.getAttribute('data-id'):null;

  if(b.hasAttribute('data-dbmode')){
    DB.mode=b.getAttribute('data-dbmode');PAGES.database();return;
  }
  if(act==='refresh'){loadState().then(function(){route();toast(T('done'));});return;}
  if(act==='send'){sendConsole(b.getAttribute('data-c'));return;}
  if(act==='pick'){pickRoute(b.getAttribute('data-c'),b.getAttribute('data-m'),b.getAttribute('data-p'));return;}
  if(act==='uPage'){UQ.page=Number(b.getAttribute('data-p'));loadUsers();return;}
  if(act==='aPage'){AQ.page=Number(b.getAttribute('data-p'));renderAudit();return;}
  if(act==='dbPage'){DB.page=Number(b.getAttribute('data-p'));PAGES.database();return;}
  if(act==='selTable'){DB.sel=b.getAttribute('data-t');DB.page=1;PAGES.database();return;}
  if(act==='jumpToData'){DB.sel=b.getAttribute('data-t');DB.mode='data';DB.page=1;PAGES.database();return;}
  if(act==='jumpToDesigner'){DB.sel=b.getAttribute('data-t');DB.mode='designer';PAGES.database();return;}

  if(act==='copyCode'){
    var tid=b.getAttribute('data-target');var el=$('#'+tid);
    if(el){navigator.clipboard.writeText(el.textContent);toast(T('copied'));}
    return;
  }
  if(act==='exportSql'){exportSqlDump();return;}
  if(act==='exportExcel'){exportExcelWorkbook();return;}
  if(act==='exportTableCsv'){
    var curT=currentTable();if(!curT)return;
    var rows=curT.rows;var cols=curT.columns.map(function(c){return c.name;});
    var csv=[cols.join(',')].concat(rows.map(function(r){return cols.map(function(c){var v=r[c];if(v&&typeof v==='object')v=JSON.stringify(v);return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}).join(',');})).join('\n');
    downloadFile(curT.name+'-export.csv',csv,'text/csv');
    toast(T('done'));
    return;
  }

  if(act==='simMatch'){
    openDialog('<header><h2>Algorithmic Compatibility Simulation</h2><p>MESRS Higher Education Matching Calculation Engine</p></header>'+
      '<div class="body"><div class="note ok">Calculated 8 candidate diaspora scholars against 5 active university research challenges.</div>'+
      '<div class="tblw"><table class="tbl"><thead><tr><th>Diaspora Scholar</th><th>University Challenge</th><th>Compatibility</th><th>Status</th></tr></thead><tbody>'+
        '<tr><td><b>Prof. Belgacem Haba</b></td><td>USTHB Quantum AI Unit</td><td><span class="pill gold font-bold">98.4%</span></td><td><span class="pill ok">Rank 1</span></td></tr>'+
        '<tr><td><b>Dr. Amina Benali</b></td><td>ESI Cloud Cryptography</td><td><span class="pill brand font-bold">94.1%</span></td><td><span class="pill ok">Rank 2</span></td></tr>'+
        '<tr><td><b>Dr. Karim Mebarki</b></td><td>CDTA Clean Microelectronics</td><td><span class="pill gold font-bold">91.8%</span></td><td><span class="pill ok">Rank 3</span></td></tr>'+
      '</tbody></table></div></div>'+dlgFooter('Done'));
    return;
  }
  if(act==='toggleSimCycle'){DB.simCycle=!DB.simCycle;PAGES.database();return;}
  if(act==='recheckAudit'){PAGES.database();toast('Schema integrity re-verified.');return;}

  /* TABLE OPERATIONS */
  if(act==='newTable'){
    openDialog(newTableModal(),function(f){
      var o=formObj(f);var now=Date.now();
      var cleanName=String(o.name).toLowerCase().trim().replace(/[^a-z0-9_]/g,'_');
      var cols=[{id:'col-'+now+'-0',name:'id',type:o.pkType==='BIGINT'?'BIGINT':'UUID',isPrimary:true}];
      (o.cols||'').split('\n').map(function(l){return l.trim();}).filter(Boolean).forEach(function(l,i){
        var p=l.split(/\s+/);
        cols.push({id:'col-'+now+'-'+(i+1),name:p[0].toLowerCase().replace(/[^a-z0-9_]/g,'_'),type:(p.slice(1).join(' ')||'VARCHAR(255)').toUpperCase()});
      });
      cols.push({id:'col-'+now+'-c',name:'created_at',type:'TIMESTAMP WITH TIME ZONE',defaultValue:'CURRENT_TIMESTAMP'});
      cols.push({id:'col-'+now+'-u',name:'updated_at',type:'TIMESTAMP WITH TIME ZONE',defaultValue:'CURRENT_TIMESTAMP'});

      return api('POST','/api/schema/tables',{name:cleanName,description:o.description,category:o.category,columns:cols}).then(function(r){
        if(!r.ok){toast(errMsg(r),true);return false;}
        toast(r.data.message);DB.sel=cleanName;
        return loadState().then(function(){PAGES.database();});
      });
    });
    return;
  }

  if(act==='dropTable'){
    var dropT=b.getAttribute('data-t')?tablesList().filter(function(x){return x.name===b.getAttribute('data-t');})[0]:currentTable();
    if(!dropT)return;
    openDialog('<header><h2>'+esc(T('dropQ'))+' “'+esc(dropT.name)+'”</h2><p>'+esc(T('dropHelp'))+'</p></header><div class="body"><div class="note warn">'+dropT.rows.length+' '+esc(T('rows'))+' · '+dropT.columns.length+' '+esc(T('columns'))+'</div><input class="ctl mono" id="dropConfirm" autocomplete="off" placeholder="'+esc(dropT.name)+'"></div>'+dlgFooter(T('dropTable'),true),function(){
      if($('#dropConfirm').value.trim()!==dropT.name){$('#dropConfirm').setAttribute('aria-invalid','true');return false;}
      return api('DELETE','/api/schema/tables/'+encodeURIComponent(dropT.name)).then(function(r){
        if(!r.ok){toast(errMsg(r),true);return false;}
        toast(r.data.message);DB.sel=null;
        return loadState().then(function(){PAGES.database();});
      });
    },function(){$('#dropConfirm').focus();});
    return;
  }

  if(act==='editTable'){
    var curTable=currentTable();if(!curTable)return;
    var categories=['Identity','Matchmaking','Collaborations','Academic','Audit','Custom'];
    openDialog('<header><h2>Edit Table Details · '+esc(curTable.name)+'</h2></header><div class="body">'+
      '<div class="fld"><label>Table Name</label><input class="ctl mono" name="name" value="'+esc(curTable.name)+'"></div>'+
      '<div class="fld"><label>Category</label><select class="ctl" name="category">'+categories.map(function(c){return '<option '+(c===curTable.category?'selected':'')+'>'+c+'</option>';}).join('')+'</select></div>'+
      '<div class="fld"><label>Description</label><input class="ctl" name="description" value="'+esc(curTable.description||'')+'"></div>'+
    '</div>'+dlgFooter(T('save')),function(f){
      var o=formObj(f);
      return api('PUT','/api/schema/tables/'+encodeURIComponent(curTable.id||curTable.name),o).then(function(r){
        if(!r.ok){toast(errMsg(r),true);return false;}
        toast(r.data.message);DB.sel=o.name;
        return loadState().then(function(){PAGES.database();});
      });
    });
    return;
  }

  /* COLUMN OPERATIONS */
  if(act==='addColumn'){
    var ct=currentTable();if(!ct)return;
    openDialog(addColumnModal(ct.name),function(f){
      var o=formObj(f);
      var payload={name:o.name,type:o.type,defaultValue:o.defaultValue||undefined,description:o.description};
      if(o.fkTable){payload.isForeign=true;payload.foreignTable=o.fkTable;payload.foreignColumn='id';}
      return api('POST','/api/schema/tables/'+encodeURIComponent(ct.id||ct.name)+'/columns',payload).then(function(r){
        if(!r.ok){toast(errMsg(r),true);return false;}
        toast(r.data.message);
        return loadState().then(function(){PAGES.database();});
      });
    });
    return;
  }

  if(act==='delCol'){
    var ct2=currentTable();var cid=b.getAttribute('data-cid');if(!ct2||!cid)return;
    confirmDialog('Delete column from '+ct2.name+'?',cid,T('del'),function(){
      return api('DELETE','/api/schema/tables/'+encodeURIComponent(ct2.id||ct2.name)+'/columns/'+encodeURIComponent(cid)).then(function(r){
        if(!r.ok){toast(errMsg(r),true);return false;}
        toast(r.data.message);
        return loadState().then(function(){PAGES.database();});
      });
    });
    return;
  }

  /* RELATION OPERATIONS */
  if(act==='addRelation'){
    openDialog(addRelationModal(),function(f){
      var o=formObj(f);
      return api('POST','/api/schema/relations',o).then(function(r){
        if(!r.ok){toast(errMsg(r),true);return false;}
        toast(r.data.message);
        return loadState().then(function(){PAGES.database();});
      });
    });
    return;
  }

  if(act==='delRel'){
    var relId=b.getAttribute('data-rid');if(!relId)return;
    confirmDialog('Delete Foreign Key Relation?',relId,T('del'),function(){
      return api('DELETE','/api/schema/relations/'+encodeURIComponent(relId)).then(function(r){
        if(!r.ok){toast(errMsg(r),true);return false;}
        toast(r.data.message);
        return loadState().then(function(){PAGES.database();});
      });
    });
    return;
  }

  /* ROW OPERATIONS */
  if(act==='insertRow'||act==='editRow'){
    var tRow=currentTable();if(!tRow)return;
    var row=act==='editRow'?tRow.rows.filter(function(r){return String(r.id)===rid;})[0]:null;
    openDialog(rowForm(tRow,row),function(f){
      var o={};$$('input',f).forEach(function(el){if(el.name&&el.value!=='')o[el.name]=parseVal(el.value);});
      var req=row?api('PUT','/api/data/'+encodeURIComponent(tRow.name)+'/'+encodeURIComponent(row.id),o):api('POST','/api/data/'+encodeURIComponent(tRow.name),Object.assign({created_at:new Date().toISOString()},o));
      return req.then(function(r){
        if(!r.ok){toast(errMsg(r),true);return false;}
        toast(r.data.message||T('done'));
        return loadState().then(function(){PAGES.database();});
      });
    });
    return;
  }

  if(act==='delRow'){
    var tDel=currentTable();if(!tDel||!rid)return;
    confirmDialog(T('delRowQ'),tDel.name+' / '+rid,T('del'),function(){
      return api('DELETE','/api/data/'+encodeURIComponent(tDel.name)+'/'+encodeURIComponent(rid)).then(function(r){
        if(!r.ok){toast(errMsg(r),true);return false;}
        toast(r.data.message);
        return loadState().then(function(){PAGES.database();});
      });
    });
    return;
  }

  /* USER OPERATIONS */
  if(act==='newUser'){
    openDialog(userForm(),function(f){
      var o=formObj(f);
      return api('POST','/api/users',o).then(function(r){
        if(!r.ok){toast(errMsg(r),true);return false;}
        toast(r.data.message||T('done'));loadUsers();loadState();
      });
    });
    return;
  }
  if(act==='editUser'){
    var user=(S.usersPage||[]).filter(function(u){return u.id===rid;})[0];
    openDialog(userForm(user),function(f){
      var o=formObj(f);
      return api('PUT','/api/users/'+encodeURIComponent(rid),o).then(function(r){
        if(!r.ok){toast(errMsg(r),true);return false;}
        toast(r.data.message||T('done'));loadUsers();loadState();
      });
    });
    return;
  }
  if(act==='userStatus'){
    var stVal=b.getAttribute('data-s');
    api('PUT','/api/users/'+encodeURIComponent(rid),{status:stVal}).then(function(r){
      if(!r.ok){toast(errMsg(r),true);return;}
      toast(r.data.message||T('done'));loadUsers();loadState();
    });
    return;
  }
  if(act==='delUser'){
    var nm=tr.querySelector('b').textContent;
    confirmDialog(T('delUserQ'),nm,T('del'),function(){
      return api('DELETE','/api/users/'+encodeURIComponent(rid)).then(function(r){
        if(!r.ok){toast(errMsg(r),true);return false;}
        toast(r.data.message);loadUsers();loadState();
      });
    });
    return;
  }

  if(act==='exportAudit'){
    var list=filteredLogs();var cols=['createdAt','actionType','entityType','entityId','userName','userRole','ipAddress','metadata'];
    var csv=[cols.join(',')].concat(list.map(function(l){return cols.map(function(c){var v=l[c];if(v&&typeof v==='object')v=JSON.stringify(v);return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}).join(',');})).join('\n');
    downloadFile('dzbridge-audit-'+new Date().toISOString().slice(0,10)+'.csv',csv,'text/csv');
    return;
  }
  if(act==='trReset'){TR_DRAFT={en:{},fr:{},ar:{}};PAGES.translations();return;}
  if(act==='trSave'){b.disabled=true;api('PUT','/api/translations',{translations:TR_DRAFT}).then(function(r){b.disabled=false;if(!r.ok){toast(errMsg(r),true);return;}OVR=r.data.translations||{};TR_DRAFT=null;applyI18n();toast(T('saved'));PAGES.translations();});return;}
});

function userForm(u){
  u=u||{};var isNew=!u.id;var sa=(S.me||{}).role==='super_admin';
  var roles=['expert','organization'].concat(sa||(!isNew&&u.role==='admin')?['admin']:[]);
  return '<header><h2>'+esc(isNew?T('newUser'):T('edit')+' · '+(u.fullName||u.email))+'</h2></header><div class="body">'+
  '<div class="fld"><label>'+esc(T('fullName'))+'</label><input class="ctl" name="fullName" required value="'+esc(u.fullName||'')+'"></div>'+
  (isNew?'<div class="row2"><div class="fld"><label>'+esc(T('email'))+'</label><input class="ctl" name="email" type="email" required></div><div class="fld"><label>'+esc(T('password'))+'</label><input class="ctl" name="password" type="password" minlength="8" placeholder="DZbridge2026!"></div></div>':'')+
  '<div class="row2"><div class="fld"><label>'+esc(T('role'))+'</label><select class="ctl" name="role"'+(!isNew&&!sa?' disabled':'')+'>'+roles.map(function(r){return '<option'+(r===u.role?' selected':'')+'>'+r+'</option>';}).join('')+'</select></div>'+
  '<div class="fld"><label>'+esc(T('status'))+'</label><select class="ctl" name="status">'+['active','pending','suspended'].map(function(s){return '<option'+(s===(u.status||'active')?' selected':'')+'>'+s+'</option>';}).join('')+'</select></div></div>'+
  '<div class="row2"><div class="fld"><label>'+esc(T('country'))+'</label><input class="ctl" name="country" value="'+esc(u.country||'Algeria')+'"></div><div class="fld"><label>'+esc(T('city'))+'</label><input class="ctl" name="city" value="'+esc(u.city||'')+'"></div></div>'+
  '<div class="fld"><label>'+esc(T('organization'))+'</label><input class="ctl" name="organizationName" value="'+esc(u.organizationName||'')+'"></div></div>'+dlgFooter(isNew?T('create'):T('save'));
}

/* ---------------- ROUTING & INITIALIZATION ---------------- */
var ROUTES=['dashboard','users','audit','database','api','django','translations'];
function route(){
  var r=(location.hash||'#dashboard').slice(1);if(ROUTES.indexOf(r)<0)r='dashboard';
  $$('.nav a').forEach(function(a){var aNav=a.getAttribute('data-nav');a.toggleAttribute('aria-current',aNav===r);if(aNav===r)a.setAttribute('aria-current','page');});
  document.body.classList.remove('nav-open');
  if(PAGES[r])PAGES[r]();
}
window.addEventListener('hashchange',route);

$('#burger').addEventListener('click',function(){document.body.classList.toggle('nav-open');});
$('#scrim').addEventListener('click',function(){document.body.classList.remove('nav-open');});
$('#ubtn').addEventListener('click',function(e){e.stopPropagation();var m=$('#umenu');var ex=m.hidden;m.hidden=!ex;this.setAttribute('aria-expanded',String(ex));});
document.addEventListener('click',function(){var m=$('#umenu');if(m&&!m.hidden){m.hidden=true;$('#ubtn').setAttribute('aria-expanded','false');}});
$('#themeBtn').addEventListener('click',function(){var d=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',d);localStorage.setItem('dzb-theme',d);});
$('#langSel').addEventListener('change',function(e){LANG=e.target.value;localStorage.setItem('dzb-mgr-lang',LANG);applyI18n();route();});
$('#logoutBtn').addEventListener('click',function(){localStorage.removeItem('dzb_token');localStorage.removeItem('dz_token');location.href='/logout';});

$('#gsearch').addEventListener('submit',function(e){
  e.preventDefault();var q=$('#gq').value.trim();if(!q)return;
  var isTable=tablesList().some(function(t){return t.name.toLowerCase().indexOf(q.toLowerCase())>-1;});
  if(isTable){location.hash='#database';DB.sel=q.toLowerCase();DB.mode='data';route();}
  else{location.hash='#users';UQ.search=q;route();}
});

/* BOOT */
applyI18n();
api('GET','/api/auth/me').then(function(r){
  if(r.ok&&r.data){
    S.me=r.data;
    var name=r.data.fullName||r.data.email||'Admin';
    $('#userName').textContent=name;$('#userRole').textContent=r.data.role||'admin';
    $('#userAv').textContent=initials(name);
  }
});
api('GET','/api/translations').then(function(r){if(r.ok){OVR=r.data.translations||{};applyI18n();}});
loadState().then(function(){route();});

})();
</script>
</body>
