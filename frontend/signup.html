<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign up · DZ-Bridge</title>
<link rel="icon" type="image/png" href="DZ%20Bridge%20Favicon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<!-- Sign up (wireframe 02 create account · step 1 of 2, then email verification). Front-end only: see createAccount() in the script for where the API call goes. -->
<style>
:root{
  /* primitives — DS-01-Colors */
  --plum-900:#28011F;--plum-800:#3A0233;--plum-700:#4E0D45;--plum-600:#53224C;
  --lav-100:#F5ECF5;--lav-200:#EEDDEE;--mist-300:#BEC3CA;
  --gold-700:#9A7424;--gold-500:#C9A24B;--gold-100:#F6EDD8;
  --n-0:#FFFFFF;--n-50:#FAF8F3;--n-100:#F2EFE9;--n-200:#E6E0D3;--n-400:#9AA39E;--n-600:#5D6B64;--n-900:#13201A;
  --green-600:#2E7D4F;--green-50:#E7F3EC;--amber-600:#B26B12;--amber-50:#FBF0DC;--red-600:#B42318;--red-50:#FCE9E7;
  /* semantic — components use these only */
  --brand:var(--plum-800);--brand-hover:var(--plum-700);--brand-pressed:var(--plum-900);
  --bg-page:var(--n-50);--bg-surface:var(--n-0);--bg-subtle:var(--n-100);--bg-inverse:var(--plum-800);
  --text-primary:var(--n-900);--text-secondary:var(--n-600);--text-muted:var(--n-400);--text-brand:var(--plum-800);
  --text-on-brand:var(--n-0);--text-accent:var(--gold-700);
  --border:var(--n-200);--border-strong:var(--n-400);--border-focus:var(--gold-500);
  --accent-gold:var(--gold-500);--accent-lavender:var(--lav-200);--accent-lavender-subtle:var(--lav-100);
  --success:var(--green-600);--success-subtle:var(--green-50);--warning:var(--amber-600);--warning-subtle:var(--amber-50);--error:var(--red-600);--error-subtle:var(--red-50);
  --sans:"DM Sans","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Fraunces","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --arabic:"Cairo","Noto Sans Arabic","Segoe UI","Geeza Pro",Tahoma,sans-serif;
  --gutter:clamp(16px,4vw,40px);--r:22px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg-page:#160511;--bg-surface:#21091B;--bg-subtle:#2D1026;--bg-inverse:#0E030B;
  --text-primary:#F5ECF5;--text-secondary:#BEC3CA;--text-muted:#8C8590;--text-brand:#EEDDEE;--text-accent:#C9A24B;
  --border:#3A1D33;--border-strong:#6B4A63;
  --brand:#C9A24B;--brand-hover:#D9B868;--brand-pressed:#9A7424;--text-on-brand:#28011F;
  --accent-lavender:#3A1D33;--accent-lavender-subtle:#2D1026;
  --success:#5CC489;--success-subtle:#12301F;--warning:#F0A848;--warning-subtle:#3B2A10;--error:#F97066;--error-subtle:#3A1214;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg-page);color:var(--text-primary);font:400 16px/24px var(--sans);-webkit-font-smoothing:antialiased}
:root[lang="ar"] body{font:400 16px/28px var(--arabic)}
:root[lang="ar"] *{letter-spacing:0!important}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
svg{display:block}
[hidden]{display:none!important}
:focus-visible{outline:3px solid color-mix(in srgb,var(--border-focus) 65%,transparent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header — same as landing page */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg-page) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:70px;max-width:1240px;margin:0 auto;padding:0 var(--gutter)}
.brand{display:flex;align-items:center;gap:10px;font:600 20px/24px var(--sans);letter-spacing:-.01em;flex:none}
.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--plum-800);color:var(--n-0);font:600 16px/16px var(--serif)}
:root[data-theme="dark"] .mark{background:var(--brand);color:var(--text-on-brand)}
.actions{display:flex;align-items:center;gap:8px}
.lang{position:relative}
.lang-btn{display:flex;align-items:center;gap:9px;height:40px;padding:0 10px;border:1px solid transparent;border-radius:999px;background:transparent;cursor:pointer}
.lang-btn:hover{border-color:var(--border);background:var(--bg-surface)}
#langCode{font:500 14px/20px var(--sans)}
.flag{display:block;width:22px;height:15px;flex:none;border-radius:2px;box-shadow:0 0 0 1px rgba(19,32,26,.12)}
.lang-menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;min-width:190px;margin:0;padding:8px;list-style:none;background:var(--bg-surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 32px -12px rgba(58,2,51,.18);opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .16s,transform .16s;z-index:50}
.lang.open .lang-menu{opacity:1;transform:none;pointer-events:auto}
.lang-menu button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border:0;border-radius:9px;background:transparent;text-align:start;cursor:pointer}
.lang-menu button:hover,.lang-menu button:focus-visible{background:var(--bg-subtle);outline:none}
.lang-menu [aria-checked="true"]{background:var(--bg-subtle)}
.lang-menu .name{flex:1;font:400 16px/24px var(--sans)}
.lang-menu .name[lang="ar"]{font-family:var(--arabic)}
.lang-menu .code{font:400 14px/20px var(--sans);color:var(--text-muted)}
.theme-btn{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:999px;background:transparent;cursor:pointer}
.theme-btn:hover{background:var(--bg-subtle)}
.theme-btn .moon{display:none}
:root[data-theme="dark"] .theme-btn .sun{display:none}
:root[data-theme="dark"] .theme-btn .moon{display:block}

/* page */
.auth{position:relative;isolation:isolate;flex:1;display:grid;place-items:center;padding:clamp(32px,7vw,80px) var(--gutter)}
.auth::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(45% 50% at 50% 25%,color-mix(in srgb,var(--accent-gold) 14%,transparent),transparent 70%),linear-gradient(180deg,var(--accent-lavender-subtle),var(--bg-page) 70%)}
.auth::after{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(color-mix(in srgb,var(--text-accent) 35%,transparent) 1px,transparent 1.6px);background-size:28px 28px;-webkit-mask-image:radial-gradient(60% 50% at 50% 30%,#000,transparent);mask-image:radial-gradient(60% 50% at 50% 30%,#000,transparent)}
.card{width:min(560px,100%);padding:clamp(24px,5vw,40px);border-radius:var(--r);background:var(--bg-surface);border:1px solid var(--border);box-shadow:0 24px 48px -28px rgba(40,1,31,.35)}
.card.narrow{width:min(440px,100%)}
.card.center{text-align:center}
.card h1{margin:0 0 24px;font:600 30px/36px var(--serif);letter-spacing:-.015em;outline:none}
:root[lang="ar"] .card h1{font:700 28px/42px var(--arabic)}
.card.center h1{margin-bottom:10px;font-size:26px;line-height:32px}
.sub{margin:0 0 26px;font-size:15px;line-height:22px;color:var(--text-secondary)}
.sub b{color:var(--text-primary);font-weight:600;overflow-wrap:anywhere}


/* role cards */
.roles{margin:0 0 22px;padding:0;border:0;min-width:0}
.roles legend{padding:0;margin-bottom:10px;font:500 14px/20px var(--sans)}
:root[lang="ar"] .roles legend{font-family:var(--arabic)}
.role-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.role{position:relative;display:flex;flex-direction:column;gap:4px;padding:16px;border:1.5px solid var(--border);border-radius:14px;background:var(--bg-surface);cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}
.role:hover{border-color:var(--border-strong)}
.role:has(input:checked){border-color:var(--brand);background:var(--accent-lavender-subtle);box-shadow:0 0 0 1px var(--brand)}
.role:has(input:focus-visible){outline:3px solid color-mix(in srgb,var(--border-focus) 65%,transparent);outline-offset:2px}
.ricon{display:grid;place-items:center;width:40px;height:40px;margin-bottom:8px;border-radius:10px;background:var(--accent-lavender);color:var(--text-brand);transition:background .15s,color .15s}
.role:has(input:checked) .ricon{background:var(--brand);color:var(--text-on-brand)}
.tick{position:absolute;top:12px;inset-inline-end:12px;display:grid;place-items:center;width:22px;height:22px;border:1.5px solid var(--border-strong);border-radius:50%;color:transparent}
.role:has(input:checked) .tick{background:var(--brand);border-color:var(--brand);color:var(--text-on-brand)}
.role strong{font:600 15px/20px var(--sans)}
:root[lang="ar"] .role strong{font-family:var(--arabic)}

/* fields */
.field{margin-bottom:18px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px}
.lrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
label,.lbl{font:500 14px/20px var(--sans)}
:root[lang="ar"] label{font-family:var(--arabic)}
.link{font:600 14px/20px var(--sans);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;color:var(--text-brand);background:none;border:0;padding:0;cursor:pointer}
:root[lang="ar"] .link{font-family:var(--arabic)}
.link:hover{text-decoration-thickness:2px}
.input{position:relative}
.input input{width:100%;height:48px;padding:0 14px;border:1px solid var(--border-strong);border-radius:12px;background:var(--bg-surface);transition:border-color .15s,box-shadow .15s}
.input input::placeholder{color:var(--text-muted)}
.input input:hover{border-color:var(--text-secondary)}
.input input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--border-focus) 40%,transparent)}
.input input[data-warn]{border-color:var(--warning);box-shadow:0 0 0 1px var(--warning)}
.input input[aria-invalid="true"]{border-color:var(--error);box-shadow:0 0 0 1px var(--error)}
.input.pw input{padding-inline-end:76px}
.reveal{position:absolute;inset-block:6px;inset-inline-end:6px;min-width:56px;padding:0 10px;border:0;border-radius:8px;background:transparent;font:600 13px/20px var(--sans);color:var(--text-secondary);cursor:pointer}
:root[lang="ar"] .reveal{font-family:var(--arabic)}
.reveal:hover{background:var(--bg-subtle);color:var(--text-primary)}
.ferr{display:flex;gap:6px;align-items:flex-start;margin:6px 0 0;font-size:13px;line-height:18px;color:var(--error)}
.ferr svg,.fwarn svg{flex:none;margin-top:1px}
.fwarn{display:flex;gap:6px;align-items:flex-start;margin:8px 0 0;font-size:13px;line-height:18px;font-weight:500}
.fwarn svg{color:var(--warning)}
.fwarn a{font-weight:600;color:var(--text-brand);text-decoration:underline;text-underline-offset:2px}
.check{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:20px;cursor:pointer}
.check input{flex:none;width:18px;height:18px;margin:1px 0 0;accent-color:var(--brand);cursor:pointer}
.check input[aria-invalid="true"]{outline:2px solid var(--error);outline-offset:1px}
.check a,.snote a{font-weight:600;color:var(--text-brand);text-decoration:underline;text-underline-offset:2px}
.terms{margin:4px 0 24px}

/* password strength */
.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.meter i{height:4px;border-radius:2px;background:var(--border);transition:background .2s}
.meter[data-s="1"] i:nth-child(-n+1){background:var(--error)}
.meter[data-s="2"] i:nth-child(-n+2){background:var(--warning)}
.meter[data-s="3"] i:nth-child(-n+3),.meter[data-s="4"] i{background:var(--success)}
.hint{margin:8px 0 0;font-size:13px;line-height:18px;color:var(--text-secondary)}
.hint[data-s="1"]{color:var(--warning)}
.hint[data-s="3"],.hint[data-s="4"]{color:var(--success)}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;padding:0 20px;border-radius:999px;border:1.5px solid transparent;font:500 15px/20px var(--sans);cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
:root[lang="ar"] .btn{font:600 15px/24px var(--arabic)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:var(--text-on-brand)}
.btn-primary:hover{background:var(--brand-hover)}
.btn-primary:active{background:var(--brand-pressed)}
.btn-ghost{background:transparent;border-color:var(--border-strong)}
.btn-ghost:hover{border-color:var(--brand);color:var(--text-brand)}
.btn:disabled{background:var(--bg-subtle);border-color:transparent;color:var(--text-muted);cursor:not-allowed;transform:none}
.btn[aria-busy="true"]{pointer-events:none}
.spin{width:16px;height:16px;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* social */
.social{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.social button{display:flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 10px;border:1px solid var(--border);border-radius:12px;background:var(--bg-surface);box-shadow:0 2px 6px -2px rgba(19,32,26,.12);font:500 14px/20px var(--sans);cursor:pointer;transition:border-color .15s,box-shadow .15s}
.social button:hover{border-color:var(--border-strong);box-shadow:0 6px 14px -8px rgba(40,1,31,.35)}
.social svg{flex:none}
.snote{margin:10px 0 0;font-size:12px;line-height:17px;text-align:center;color:var(--text-secondary)}
.divider{display:flex;align-items:center;gap:14px;margin:22px 0 20px;font-size:14px;color:var(--text-secondary);white-space:nowrap}
.divider::before,.divider::after{content:"";flex:1;border-top:2px dotted var(--border-strong);opacity:.7}

.foot{margin:22px 0 0;text-align:center;font-size:14px;line-height:20px;color:var(--text-secondary)}
.foot a{font-weight:600;color:var(--text-primary);text-decoration:underline;text-underline-offset:3px}
.mono{margin:14px 0 0;font:400 12px/16px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.mono a{color:var(--text-brand);text-decoration:underline;text-underline-offset:3px}

/* status icons */
.badge{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 18px;border-radius:50%;background:var(--accent-lavender);color:var(--text-brand)}
.badge.ok{background:var(--brand);color:var(--text-on-brand)}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;z-index:60;max-width:calc(100vw - 32px);padding:12px 18px;border-radius:999px;background:var(--plum-900);color:var(--n-0);font-size:14px;line-height:20px;box-shadow:0 16px 32px -12px rgba(40,1,31,.5);transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
:root[data-theme="dark"] .toast{background:var(--lav-100);color:var(--plum-900)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:480px){.social button span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
@media (max-width:420px){.top .brand>span:last-child{display:none}}
@media (max-width:380px){.role-grid,.row2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation-duration:2s!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="landing_page.html" aria-label="DZ-Bridge"><span class="mark">DZ</span><span>DZ-Bridge</span></a>
    <div class="actions">
      <div class="lang" id="lang">
        <button class="lang-btn" id="langBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="langMenu">
          <span id="langFlag"></span><span id="langCode">EN</span>
        </button>
        <ul class="lang-menu" id="langMenu" role="menu" aria-labelledby="langBtn">
          <li role="none"><button type="button" role="menuitemradio" data-lang="fr" aria-checked="false"><svg class="flag" viewBox="0 0 30 20" aria-hidden="true"><rect width="10" height="20" fill="#002395"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#ED2939"/></svg><span class="name" lang="fr">Français</span><span class="code">FR</span></button></li>
          <li role="none"><button type="button" role="menuitemradio" data-lang="en" aria-checked="true"><svg class="flag" viewBox="0 0 60 30" aria-hidden="true"><clipPath id="ukc"><path d="M0 0h60v30H0z"/></clipPath><clipPath id="ukt"><path d="M30 15h30v15zv15H0zH0V0zV0h30z"/></clipPath><g clip-path="url(#ukc)"><path d="M0 0v30h60V0z" fill="#012169"/><path d="M0 0l60 30m0-30L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0l60 30m0-30L0 30" clip-path="url(#ukt)" stroke="#C8102E" stroke-width="4"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/></g></svg><span class="name" lang="en">English</span><span class="code">EN</span></button></li>
          <li role="none"><button type="button" role="menuitemradio" data-lang="ar" aria-checked="false"><svg class="flag" viewBox="0 0 30 20" aria-hidden="true"><rect width="15" height="20" fill="#006233"/><rect x="15" width="15" height="20" fill="#fff"/><circle cx="15" cy="10" r="5" fill="#D21034"/><circle cx="16.3" cy="10" r="4" fill="#fff"/><path d="M17.6 10l2.9-.95-1.8 2.45V8.5l1.8 2.45z" fill="#D21034"/></svg><span class="name" lang="ar">العربية</span><span class="code">AR</span></button></li>
        </ul>
      </div>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch to dark theme" aria-pressed="false">
        <svg class="sun" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g></svg>
        <svg class="moon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="auth">

  <!-- 02 · Create account (step 1 of 2) -->
  <section class="card" data-view="form" aria-labelledby="suH">
    <h1 id="suH" tabindex="-1" data-i18n="suH">Create your account</h1>

    <form id="suForm" novalidate>
      <!-- 1 · role -->
      <fieldset class="roles">
        <legend><span data-i18n="roleL">I am joining as</span></legend>
        <div class="role-grid">
          <label class="role">
            <input class="sr" type="radio" name="role" value="expert" checked>
            <span class="ricon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c.9-3.7 3.9-6 7.5-6s6.6 2.3 7.5 6"/></g></svg></span>
            <span class="tick" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 20 20"><path d="M4.5 10.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <strong data-i18n="exT">Expert</strong>
          </label>
          <label class="role">
            <input class="sr" type="radio" name="role" value="org">
            <span class="ricon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20.5V5.5l8-2.5v17.5M12 8.5l8 2.5v9.5M2.5 20.5h19"/><path d="M7.5 8.5h1M7.5 12h1M7.5 15.5h1M15.5 13.5h1M15.5 17h1"/></g></svg></span>
            <span class="tick" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 20 20"><path d="M4.5 10.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <strong data-i18n="orT">Organization</strong>
          </label>
        </div>
      </fieldset>

      <!-- social sign-up (uses the role chosen above) -->
      <div class="social">

/* ---------- API (connected to DZ-Bridge backend with offline support) ---------- */
function delay(v){return new Promise(function(r){setTimeout(function(){r(v);},500);});}
function emailTaken(email) {
  var em = email.toLowerCase().trim();
  if (TAKEN.indexOf(em) > -1) return Promise.resolve(true);
  return fetch('/api/state/full').then(function(res) {
    if (res.ok) {
      return res.json().then(function(state) {
        var found = (state.users || []).some(function(u) { return u.email && u.email.toLowerCase() === em; });
        return found;
      });
    }
    return false;
  }).catch(function() {
    try {
      var localUsers = JSON.parse(localStorage.getItem('dzb_local_users') || '[]');
      return localUsers.some(function(u) { return u.email.toLowerCase() === em; });
    } catch(e) {
      return false;
    }
  });
}

function createAccount(data) {
  var payload = {
    email: data.email.trim().toLowerCase(),
    password: data.password,
    role: data.role === 'org' ? 'organization' : 'expert',
    fullName: (data.firstName + ' ' + data.lastName).trim(),
    organizationName: data.organization || ''
  };

  try {
    var localUsers = JSON.parse(localStorage.getItem('dzb_local_users') || '[]');
    localUsers.push(payload);
    localStorage.setItem('dzb_local_users', JSON.stringify(localUsers));
  } catch(e) {}

  return fetch('/api/auth/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(function(res) {
    return true;
  }).catch(function(err) {
    console.warn('[Offline Mode] Registered locally in browser storage:', err);
    return true;
  });
}

function resendVerification(email) {
  return fetch('/api/auth/magic-link', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email })
  }).then(function() {
    return true;
  }).catch(function() {
    return true;
  });
}

/* ---------- fields ---------- */
var suForm=$('#suForm'),suOrg=$('#suOrg'),suFn=$('#suFn'),suLn=$('#suLn'),suEmail=$('#suEmail'),suPw=$('#suPw'),suTerms=$('#suTerms'),suBtn=$('#suBtn');
[[suOrg,'suOrgErr'],[suFn,'suFnErr'],[suLn,'suLnErr'],[suPw,'suPwErr']].forEach(function(p){p[0].addEventListener('input',function(){if(!$('#'+p[1]).hidden)setErr(p[1],null);});});
suTerms.addEventListener('change',function(){if(suTerms.checked)setErr('suTermsErr',null);});

/* 2 · email — warn early when the address is already registered */
var takenEl=$('#suEmailTaken'),takenOn=false;
function setTaken(on){
  takenOn=on;takenEl.hidden=!on;
  if(on){takenEl.innerHTML=ICON_WARN+'<span>'+T('taken')+'</span>';suEmail.setAttribute('data-warn','');}
  else suEmail.removeAttribute('data-warn');
}
suEmail.addEventListener('input',function(){if(!$('#suEmailErr').hidden)setErr('suEmailErr',null);if(takenOn)setTaken(false);});
suEmail.addEventListener('blur',function(){
  var email=suEmail.value.trim();
  if(!validEmail(email))return;
  emailTaken(email).then(function(t){if(suEmail.value.trim()===email)setTaken(t);});
});

/* 3 · password */
var suReveal=$('#suReveal'),suMeter=$('#suMeter'),suPwHint=$('#suPwHint');
function pwOk(p){return p.length>=MIN_PW&&/\d/.test(p);}
function score(p){
  if(!p)return 0;
  if(!pwOk(p))return 1;
  return Math.min(4,2+(/[a-z]/.test(p)&&/[A-Z]/.test(p)?1:0)+(/[^A-Za-z0-9]/.test(p)?1:0)+(p.length>=14?1:0));
}
function renderStrength(){
  var p=suPw.value,s=score(p);
  suMeter.setAttribute('data-s',String(s));suPwHint.setAttribute('data-s',String(s));
  var lvl=s===0?'':s===1?'⚠ '+T(p.length<MIN_PW?'short':'noNum'):T(['','','fair','good','strong'][s]);
  suPwHint.textContent=(lvl?lvl+' · ':'')+T('rule');
}
suPw.addEventListener('input',renderStrength);
function syncReveal(){var on=suReveal.getAttribute('aria-pressed')==='true';suReveal.textContent=T(on?'hide':'show');suReveal.setAttribute('aria-label',T(on?'hideA':'showA'));}
suReveal.addEventListener('click',function(){var on=suPw.type==='password';suPw.type=on?'text':'password';suReveal.setAttribute('aria-pressed',String(on));syncReveal();suPw.focus();});

/* ---------- submit ---------- */
var sentEmail='';
suForm.addEventListener('submit',function(e){
  e.preventDefault();
  if(suBtn.getAttribute('aria-busy'))return;
  var role=curRole(),email=suEmail.value.trim();
  var checks=[
    [suOrg,'suOrgErr',role==='org'&&!suOrg.value.trim()?'errOrg':null],
    [suFn,'suFnErr',suFn.value.trim()?null:'errFn'],
    [suLn,'suLnErr',suLn.value.trim()?null:'errLn'],
    [suEmail,'suEmailErr',validEmail(email)?null:'errEmail'],
    [suPw,'suPwErr',pwOk(suPw.value)?null:'errPw'],
    [suTerms,'suTermsErr',suTerms.checked?null:'errTerms']
  ],first=null;
  checks.forEach(function(c){if(c[0]===suOrg&&role!=='org')return;setErr(c[1],c[2]);if(c[2]&&!first)first=c[0];});
  if(first){first.focus();return;}
  busy(suBtn,true,T('busy'));
  emailTaken(email).then(function(t){
    if(t){busy(suBtn,false);setTaken(true);suEmail.focus();return;}
    return createAccount({
      role:role,organization:role==='org'?suOrg.value.trim():null,
      firstName:suFn.value.trim(),lastName:suLn.value.trim(),email:email,password:suPw.value,acceptedTerms:true
    }).then(function(){busy(suBtn,false);openVerify(email);});
  });
});

/* ---------- 02B · Verify email ---------- */
var resendBtn=$('#resendBtn'),cooldownEnd=0,cdTimer=null;
function openVerify(email){sentEmail=email;startCooldown();refreshDynamic();show('verify',true);}
function startCooldown(){
  cooldownEnd=Date.now()+RESEND_S*1000;clearInterval(cdTimer);
  cdTimer=setInterval(function(){renderResend();if(Date.now()>=cooldownEnd)clearInterval(cdTimer);},1000);
  renderResend();
}
function renderResend(){
  var left=cooldownEnd-Date.now();
  resendBtn.disabled=left>0;
  resendBtn.textContent=left>0?T('resendIn',mmss(left)):T('resend');
}
resendBtn.addEventListener('click',function(){resendVerification(sentEmail).then(function(){toast(T('resent'));startCooldown();});});
$('#changeEmail').addEventListener('click',function(e){e.preventDefault();show('form',false);suEmail.focus();suEmail.select();});
$('#demoVerify').addEventListener('click',function(e){e.preventDefault();show('verified',true);});

/* strings built in JS — re-render on language change */
function refreshDynamic(){
  if(!suForm)return;
  syncReveal();renderStrength();renderResend();
  if(sentEmail)$('#vS').innerHTML=T('vS',esc(sentEmail));
  $('#dnS').textContent=T('dnS',curRole());
  if(takenOn)setTaken(true);
  $$('.ferr').forEach(function(err){if(err.dataset.key)setErr(err.id,err.dataset.key);});
}

/* ---------- boot ---------- */
var st=null;try{st=localStorage.getItem('dzb-theme');}catch(e){}
document.documentElement.setAttribute('data-theme',st||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
var qr=(new URLSearchParams(location.search).get('role')||'').toLowerCase();
if(qr==='org'||qr==='organization'){$('input[name="role"][value="org"]').checked=true;}
syncRole();
var saved=null;try{saved=localStorage.getItem('dzb-lang');}catch(e){}
var nl=(navigator.language||'').slice(0,2);
applyLang(saved||(nl==='ar'||nl==='fr'?nl:'en'));
})();
</script>
</body>
</html>
